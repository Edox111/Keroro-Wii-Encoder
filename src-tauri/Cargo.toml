[package]
name = "keroro-wii-encoder"
version = "1.3.0"
description = "Batch anime encoder for Nintendo Wii playback"
authors = ["Edox"]
edition = "2024"

[lib]
name = "keroro_wii_encoder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4.34", features = ["std"] }
tauri-plugin-single-instance = "2"
keroro-encoder-core = { path = "crates/encoder-core" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
